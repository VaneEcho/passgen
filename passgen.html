<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #64748b;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            --action: #c2410c;
            --action-hover: #9a3412;
            --background: #ffffff;
            --surface: #f8fafc;
            --border: #e2e8f0;
            --text: #1e293b;
            --text-muted: #64748b;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --background: #0f172a;
            --surface: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --action: #f97316;
            --action-hover: #ea580c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0.8rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
        }

        .theme-toggle {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            font-size: 0.85rem;
        }

        .theme-toggle:hover {
            background: var(--border);
        }

        .main-card {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.2rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }

        .generated-passwords {
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }

        .generated-passwords h3 {
            margin-bottom: 0.6rem;
            color: var(--text);
            font-size: 1.1rem;
        }

        .password-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.7rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-bottom: 0.5rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .password-item:hover {
            border-color: var(--primary);
        }

        .password-item.copied-item {
            background: rgba(37, 99, 235, 0.1);
            border-color: var(--primary);
        }

        .password-item:last-child {
            margin-bottom: 0;
        }

        .password-text {
            flex: 1;
            min-width: 0;
            margin-right: 0.8rem;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
        }

        .copy-btn {
            background: var(--success);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #047857;
        }

        .copy-btn.copied {
            background: var(--primary) !important;
        }

        .controls-row {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1rem;
            align-items: stretch;
        }

        .generate-button {
            flex: 1;
            background: var(--action);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.7rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .generate-button:hover {
            background: var(--action-hover);
        }

        .generate-button:focus-visible {
            outline: 3px solid var(--action);
            outline-offset: 2px;
        }

        .mode-selector {
            display: flex;
            gap: 0.5rem;
        }

        .mode-button {
            background: var(--background);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            font-weight: 500;
            color: var(--text);
            font-size: 0.9rem;
        }

        .mode-button.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .mode-button:hover:not(.active) {
            border-color: var(--primary);
        }

        .settings-panel {
            margin-bottom: 0;
        }

        .setting-group {
            margin-bottom: 0.8rem;
        }

        .setting-label {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.4rem;
            display: block;
            font-size: 0.9rem;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .slider {
            flex: 1;
            height: 5px;
            border-radius: 3px;
            background: var(--border);
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        .slider-value {
            min-width: 2.5rem;
            text-align: center;
            font-weight: 600;
            color: var(--primary);
            background: var(--background);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 0.5rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 0.5rem;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        .checkbox-item:hover {
            border-color: var(--primary);
        }

        .checkbox-item input[type="checkbox"] {
            width: 14px;
            height: 14px;
            margin-right: 0.5rem;
            cursor: pointer;
        }

        .passphrase-settings {
            display: none;
        }

        .passphrase-settings.active {
            display: block;
        }

        .separator-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0.4rem;
            margin-bottom: 0.6rem;
        }

        .separator-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.4rem;
            background: var(--background);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .separator-item:hover {
            border-color: var(--primary);
        }

        .separator-item input[type="radio"] {
            margin-right: 0.3rem;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0.6rem;
            }
            
            .main-card {
                padding: 1rem;
            }
            
            .controls-row {
                flex-direction: column;
            }
            
            .mode-selector {
                flex-direction: column;
            }
            
            .checkbox-grid {
                grid-template-columns: 1fr;
            }
            
            .separator-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            
            .password-item {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            
            .password-text {
                margin-right: 0;
                text-align: center;
            }
        }
    </style>

    <style>
        html, body {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .password-item {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="header">
            <h1>密码生成器</h1>
            <button class="theme-toggle" onclick="toggleTheme()">
                <span id="theme-text">深色模式</span>
            </button>
        </div>

        <div class="main-card">
            <div class="generated-passwords">
                <h3>生成的密码</h3>
                <div id="password-list"></div>
            </div>
            
            <div class="controls-row">
                <button class="generate-button" onclick="generatePasswords()">生成密码</button>
                <div class="mode-selector">
                    <button class="mode-button active" onclick="setMode('random', this)">随机密码</button>
                    <button class="mode-button" onclick="setMode('passphrase', this)">短语密码</button>
                </div>
            </div>

            <div class="settings-panel">
                <!-- 随机密码设置 -->
                <div class="random-settings" id="random-settings">
                    <div class="setting-group">
                        <label class="setting-label">密码长度</label>
                        <div class="slider-container">
                            <input type="range" class="slider" id="length" min="8" max="32" value="16" oninput="updateLength(); generatePasswords()">
                            <span class="slider-value" id="length-value">16</span>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">字符类型</label>
                        <div class="checkbox-grid">
                            <label class="checkbox-item">
                                <input type="checkbox" id="uppercase" checked onchange="generatePasswords()">
                                <span>大写字母 (A-Z)</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="lowercase" checked onchange="generatePasswords()">
                                <span>小写字母 (a-z)</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="numbers" checked onchange="generatePasswords()">
                                <span>数字 (0-9)</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="markdown-safe" checked onchange="generatePasswords()">
                                <span>Markdown安全符号</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="exclude-similar" checked onchange="generatePasswords()">
                                <span>排除相似字符</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="symbols" onchange="generatePasswords()">
                                <span>其他特殊符号</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 短语密码设置 -->
                <div class="passphrase-settings" id="passphrase-settings">
                    <div class="setting-group">
                        <label class="setting-label">单词数量</label>
                        <div class="slider-container">
                            <input type="range" class="slider" id="word-count" min="2" max="8" value="4" oninput="updateWordCount(); generatePasswords()">
                            <span class="slider-value" id="word-count-value">4</span>
                        </div>
                    </div>

                    <div class="setting-group">
                        <label class="setting-label">连接符</label>
                        <div class="separator-grid">
                            <label class="separator-item">
                                <input type="radio" name="separator" value="-" checked onchange="generatePasswords()">
                                <span>-</span>
                            </label>
                            <label class="separator-item">
                                <input type="radio" name="separator" value="." onchange="generatePasswords()">
                                <span>.</span>
                            </label>
                            <label class="separator-item">
                                <input type="radio" name="separator" value="_" onchange="generatePasswords()">
                                <span>_</span>
                            </label>
                            <label class="separator-item">
                                <input type="radio" name="separator" value=")" onchange="generatePasswords()">
                                <span>)</span>
                            </label>
                            <label class="separator-item">
                                <input type="radio" name="separator" value="" onchange="generatePasswords()">
                                <span>无</span>
                            </label>
                        </div>
                    </div>

                    <div class="setting-group">
                        <div class="checkbox-grid">
                            <label class="checkbox-item">
                                <input type="checkbox" id="add-numbers" onchange="generatePasswords()">
                                <span>添加数字</span>
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="capitalize" onchange="generatePasswords()">
                                <span>首字母大写</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="eff-large-wordlist.js"></script>
    <script>
        let currentMode = 'random';
        let lastCopiedPassword = null; // 记录最后复制的密码
        
        const charSets = {
            uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
            lowercase: 'abcdefghijklmnopqrstuvwxyz',
            numbers: '0123456789',
            symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?',
            markdownSafe: '.+_-=~', // 真正不会破坏 markdown 的字符
            similar: '!$0125689BDGIOQSZbgijloqsz|'
        };

        const commonWords = EFF_LARGE_WORDLIST;
        const colorScheme = window.matchMedia('(prefers-color-scheme: dark)');

        // 初始化
        window.onload = function() {
            loadTheme();
            generatePasswords();
        };

        function toggleTheme() {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            applyTheme(isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            const theme = savedTheme || (colorScheme.matches ? 'dark' : 'light');
            applyTheme(theme);
        }

        function applyTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            document.getElementById('theme-text').textContent = theme === 'dark' ? '浅色模式' : '深色模式';
        }

        colorScheme.addEventListener('change', (event) => {
            if (!localStorage.getItem('theme')) {
                applyTheme(event.matches ? 'dark' : 'light');
            }
        });

        function setMode(mode, button) {
            currentMode = mode;
            const buttons = document.querySelectorAll('.mode-button');
            buttons.forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            
            document.getElementById('random-settings').classList.toggle('hidden', mode !== 'random');
            document.getElementById('passphrase-settings').classList.toggle('active', mode === 'passphrase');
            
            generatePasswords();
        }

        function generatePasswords() {
            const container = document.getElementById('password-list');
            container.innerHTML = '';
            
            for (let i = 0; i < 5; i++) {
                const password = currentMode === 'random' ? generateRandomPassword() : generatePassphrase();
                createPasswordItem(password, container);
            }
        }

        function generateRandomPassword() {
            const length = parseInt(document.getElementById('length').value);
            let requiredChars = [];
            let allChars = '';
            
            // 收集所有选中的字符类型，并确保每种类型至少有一个字符
            const charTypes = [];
            
            if (document.getElementById('uppercase').checked) {
                charTypes.push('uppercase');
                requiredChars.push(getRandomChar(charSets.uppercase));
                allChars += charSets.uppercase;
            }
            if (document.getElementById('lowercase').checked) {
                charTypes.push('lowercase');
                requiredChars.push(getRandomChar(charSets.lowercase));
                allChars += charSets.lowercase;
            }
            if (document.getElementById('numbers').checked) {
                charTypes.push('numbers');
                requiredChars.push(getRandomChar(charSets.numbers));
                allChars += charSets.numbers;
            }
            if (document.getElementById('symbols').checked) {
                charTypes.push('symbols');
                requiredChars.push(getRandomChar(charSets.symbols));
                allChars += charSets.symbols;
            }
            if (document.getElementById('markdown-safe').checked) {
                charTypes.push('markdownSafe');
                requiredChars.push(getRandomChar(charSets.markdownSafe));
                allChars += charSets.markdownSafe;
            }
            
            // 排除相似字符
            if (document.getElementById('exclude-similar').checked) {
                allChars = allChars.split('').filter(char => !charSets.similar.includes(char)).join('');
                // 重新检查必需字符是否包含相似字符
                requiredChars = requiredChars.map((char, index) => {
                    if (charSets.similar.includes(char)) {
                        const type = charTypes[index];
                        const availableChars = charSets[type].split('').filter(c => !charSets.similar.includes(c)).join('');
                        return availableChars.length > 0 ? getRandomChar(availableChars) : '';
                    }
                    return char;
                }).filter(char => char !== '');
            }
            
            if (allChars.length === 0) {
                alert('请至少选择一种字符类型！');
                return '';
            }
            
            // 生成剩余的随机字符
            let remainingLength = length - requiredChars.length;
            let password = '';
            
            // 如果密码长度小于必需字符数量，只使用部分必需字符
            if (remainingLength < 0) {
                requiredChars = shuffleArray(requiredChars).slice(0, length);
                password = requiredChars.join('');
            } else {
                // 生成剩余的随机字符
                for (let i = 0; i < remainingLength; i++) {
                    password += getRandomChar(allChars);
                }
                
                // 将必需字符插入到随机位置
                password = password.split('');
                requiredChars.forEach(char => {
                    const pos = secureRandomInt(password.length + 1);
                    password.splice(pos, 0, char);
                });
                password = password.join('');
            }
            
            return password;
        }

        function secureRandomInt(maxExclusive) {
            if (!Number.isInteger(maxExclusive) || maxExclusive <= 0 || maxExclusive > 0x100000000) {
                throw new RangeError('maxExclusive must be a positive integer');
            }

            const limit = 0x100000000 - (0x100000000 % maxExclusive);
            const values = new Uint32Array(1);
            do {
                crypto.getRandomValues(values);
            } while (values[0] >= limit);
            return values[0] % maxExclusive;
        }

        function getRandomChar(chars) {
            return chars.charAt(secureRandomInt(chars.length));
        }

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = secureRandomInt(i + 1);
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function generatePassphrase() {
            const wordCount = parseInt(document.getElementById('word-count').value);
            const separator = document.querySelector('input[name="separator"]:checked').value;
            const addNumbers = document.getElementById('add-numbers').checked;
            const capitalize = document.getElementById('capitalize').checked;
            
            const selectedWords = [];
            const usedIndexes = new Set();
            
            while (selectedWords.length < wordCount) {
                const index = secureRandomInt(commonWords.length);
                if (!usedIndexes.has(index)) {
                    usedIndexes.add(index);
                    let word = commonWords[index];
                    
                    // 首字母大写处理
                    if (capitalize) {
                        word = word.charAt(0).toUpperCase() + word.slice(1);
                    }
                    
                    selectedWords.push(word);
                }
            }
            
            let passphrase = selectedWords.join(separator);
            
            if (addNumbers) {
                const randomNum = secureRandomInt(1000);
                passphrase += (separator || '') + randomNum;
            }
            
            return passphrase;
        }

        function createPasswordItem(password, container) {
            const item = document.createElement('div');
            item.className = 'password-item';
            
            // 检查是否是上次复制的密码
            if (password === lastCopiedPassword) {
                item.classList.add('copied-item');
            }
            
            item.onclick = function() { copyText(password, this); };
            
            const span = document.createElement('span');
            span.className = 'password-text';
            span.textContent = password;
            
            const button = document.createElement('button');
            button.className = 'copy-btn';
            button.textContent = '复制';
            
            // 如果是上次复制的密码，显示已复制状态
            if (password === lastCopiedPassword) {
                button.classList.add('copied');
                button.textContent = '✔ 已复制';
            }
            
            button.onclick = function(e) { 
                e.stopPropagation(); // 阻止事件冒泡
                copyText(password, this); 
            };
            
            item.appendChild(span);
            item.appendChild(button);
            container.appendChild(item);
        }

        function copyText(text, element) {
            navigator.clipboard.writeText(text).then(() => {
                // 移除之前的复制状态
                document.querySelectorAll('.password-item').forEach(item => {
                    item.classList.remove('copied-item');
                    const btn = item.querySelector('.copy-btn');
                    if (btn && btn.textContent === '✔ 已复制') {
                        btn.classList.remove('copied');
                        btn.textContent = '复制';
                    }
                });
                
                // 记录最后复制的密码
                lastCopiedPassword = text;
                
                // 添加新的复制状态
                const passwordItem = element.closest('.password-item') || element.parentElement;
                passwordItem.classList.add('copied-item');
                
                const button = element.querySelector('.copy-btn') || element;
                button.classList.add('copied');
                button.textContent = '✔ 已复制';
                
            }).catch(() => {
                // 备用复制方法
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                // 同样的状态处理
                document.querySelectorAll('.password-item').forEach(item => {
                    item.classList.remove('copied-item');
                    const btn = item.querySelector('.copy-btn');
                    if (btn && btn.textContent === '✔ 已复制') {
                        btn.classList.remove('copied');
                        btn.textContent = '复制';
                    }
                });
                
                lastCopiedPassword = text;
                
                const passwordItem = element.closest('.password-item') || element.parentElement;
                passwordItem.classList.add('copied-item');
                
                const button = element.querySelector('.copy-btn') || element;
                button.classList.add('copied');
                button.textContent = '✔ 已复制';
            });
        }

        function updateLength() {
            document.getElementById('length-value').textContent = document.getElementById('length').value;
        }
        
        function updateWordCount() {
            document.getElementById('word-count-value').textContent = document.getElementById('word-count').value;
        }
    </script>
</body>
</html>
